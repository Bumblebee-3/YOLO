<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Circle Search · Opening Google Lens</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#252744,#101119 65%);color:#f3f3ff}main{max-width:440px;padding:40px;text-align:center}img{max-width:100%;max-height:260px;border-radius:20px;box-shadow:0 20px 60px #0005}h1{font-size:27px;letter-spacing:-.8px}p{line-height:1.6;color:#b6b7ce}button,a{display:inline-block;border:0;border-radius:30px;background:#b9b0ff;color:#171327;padding:14px 24px;font:600 15px system-ui;cursor:pointer;text-decoration:none}a{background:transparent;color:#cec7ff;padding:14px}small{display:block;color:#85859d;margin-top:24px}
</style>
<main><img id="preview" alt="Your selected area"><h1 id="status">Opening Google Lens…</h1><p>Searching with just the area you selected.</p>
<form id="search" method="post" enctype="multipart/form-data" action="https://www.google.com/searchbyimage/upload">
<input type="file" id="image" name="encoded_image" hidden><input type="hidden" name="processed_image_dimensions" value="__DIMENSIONS__">
<button type="submit">Search again</button></form><a id="download" download="circle-search.png">Save image</a><a href="https://lens.google.com/">Open Lens manually</a><small>Your selected image is sent to Google for this search.</small></main>
<script>
const encoded = '__IMAGE__';
const url = 'data:image/png;base64,' + encoded;
document.getElementById('preview').src = url;
document.getElementById('download').href = url;
try {
  const bytes = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));
  const transfer = new DataTransfer();
  transfer.items.add(new File([bytes], 'circle-search.png', {type:'image/png'}));
  document.getElementById('image').files = transfer.files;
  const form = document.getElementById('search');
  const destination = new URL(form.action);
  destination.searchParams.set('st', Date.now());
  form.action = destination.href;
  setTimeout(() => form.requestSubmit(), 180);
} catch (error) {
  document.getElementById('status').textContent = 'Open Lens to finish searching';
  document.querySelector('p').textContent = 'Save the image below, then upload it in Google Lens.';
  document.querySelector('button').hidden = true;
}
</script></html>
